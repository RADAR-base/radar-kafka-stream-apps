#================================ Kafka ================================#
#List of Kafka brokers
broker:
  - host: radar-kafka-kafka-bootstrap
    port: 9094

#Kafka internal parameters

#============================ Kafka Streams ============================#
#The number of threads that a stream must be run according is priority
stream:
  threads_per_priority:
    low: 1
    normal: 2
    high: 4

  properties:
    max.request.size: 3500042 #Set message.max.bytes for kafka brokers higher than or equal to this value
    retries: 15
    session.timeout.ms: 20000

  streams:
    - class: org.radarbase.stream.ruleengine.RuleEngineStream
      properties:
        input_topic: questionnaire_response
        output_topic: rule_engine_output
        global_store_name: JIT_RULES_STORE
        global_store_topic: rule_engine_config


#=========================== Schema Registry ===========================#
#List of Schema Registry instances
schema_registry:
  - host: localhost
    port: 8081
    protocol: http
