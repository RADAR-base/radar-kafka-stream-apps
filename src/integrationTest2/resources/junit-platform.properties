# Test classes run concurrently against the shared KafkaBroker; methods within a class run sequentially.
# This is safe only because every test uses its own random topic, store and application-id suffix (see
# Topics.unique()) and keeps no mutable state outside its class instance.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Backstop so a test that never returns fails instead of hanging the build. Test bodies only:
# @BeforeAll starts the Kafka container, which can take minutes when the image still has to be pulled.
junit.jupiter.execution.timeout.testable.method.default=2 m
